apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kcsa-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Takapiwanashe/kcsa.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kcsa-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true


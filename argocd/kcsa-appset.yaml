apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kcsa-environments
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - env: dev
        namespace: kcsa-dev
        autoSync: "true"
      - env: qa
        namespace: kcsa-qa
        autoSync: "true"
      - env: staging
        namespace: kcsa-staging
        autoSync: "true"
      - env: prod
        namespace: kcsa-prod
        autoSync: "false" # Require manual approval/sync click in UI for prod!
  template:
    metadata:
      name: 'kcsa-{{env}}'
    spec:
      project: default
      source:
        repoURL: git@github.com:Takapiwanashe/kcsa.git
        targetRevision: main
        path: 'environments/{{env}}' # Looks for environments/dev, environments/qa, etc.
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kcsa-environments
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - env: dev
        namespace: kcsa-dev
      - env: qa
        namespace: kcsa-qa
      - env: staging
        namespace: kcsa-staging
  template:
    metadata:
      name: 'kcsa-{{env}}'
    spec:
      project: default
      source:
        repoURL: git@github.com:Takapiwanashe/kcsa.git
        targetRevision: main
        path: 'environments/{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kcsa-prod-env
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - env: prod
        namespace: kcsa-prod
  template:
    metadata:
      name: 'kcsa-{{env}}'
    spec:
      project: default
      source:
        repoURL: git@github.com:Takapiwanashe/kcsa.git
        targetRevision: main
        path: 'environments/{{env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        syncOptions:
        - CreateNamespace=true

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kcsa-prod
resources:
- ../../base
images:
- name: takapiwanashe/app-multi
  newTag: v1.0.0
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: go-app
    spec:
      replicas: 3
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: go-app-container
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kcsa-prod
resources:
- ../../base
images:
- digest: sha256:d98cbd3c9c17849dc00f1bed3a9c43bd168e768b2618cee491fd7dccc4309014
  name: takapiwanashe/app-multi
  newName: takapiwanashe/app-multi
  newTag: v1.0.1
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: go-app
    spec:
      replicas: 3
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: go-app-container
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL

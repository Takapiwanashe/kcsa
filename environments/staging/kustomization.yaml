apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kcsa-staging
resources:
- ../../base
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: go-app
    spec:
      replicas: 2
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: go-app-container
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL

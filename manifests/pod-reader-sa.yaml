apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reader-sa
  namespace: kcsa-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dev-pod-reader
  namespace: kcsa-dev
rules:
- apiGroups: [""] # "" indicates the core API group (pods, services, configmaps, secrets)
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods-in-dev
  namespace: kcsa-dev
subjects:
- kind: ServiceAccount
  name: pod-reader-sa
  namespace: kcsa-dev
roleRef:
  kind: Role
  name: dev-pod-reader
  apiGroup: rbac.authorization.k8s.io


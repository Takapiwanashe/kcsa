apiVersion: v1
kind: Pod
metadata:
  name: insecure-pod
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 2000
    fsGroup: 3000
  containers:
    - name: insecure-container
      image: busybox:latest
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-root
          mountPath: /host
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
  volumes:
    - name: host-root
      hostPath:
        path: /

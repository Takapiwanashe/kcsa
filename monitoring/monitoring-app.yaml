apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.io
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      valuesObject:
        grafana:
          enabled: true
          adminPassword: "ChangeMeForLab123!"
        # Keep resource usage lightweight for local/KCSA lab clusters
        prometheus:
          prometheusSpec:
            retention: 3d
            serviceMonitorSelectorNilUsesHelmValues: false
  destination:
    server: https://default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

